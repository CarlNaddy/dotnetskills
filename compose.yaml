# Local development infrastructure.
#   docker compose up -d db      # start PostgreSQL before `dotnet watch run`
#   docker compose down          # stop (data survives in the named volume)
#   docker compose down -v       # stop and wipe the database
#
# The app itself is not containerised here yet — that (plus a mail sink) is
# added in rails-parity plan P5.2. Dev connection string goes in user-secrets
# (plan P1.3), not in appsettings.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dotnetskills
      POSTGRES_USER: dotnetskills
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotnetskills -d dotnetskills"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
